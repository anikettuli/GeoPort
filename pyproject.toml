[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoport"
version = "5.0.0"
description = "Modern iOS Location Simulation and Testing Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GeoPort Contributors" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pymobiledevice3>=11.0.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pyuac>=0.0.3",
    "pycountry>=24.6.1",
    "websockets>=13.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[project.scripts]
geoport = "src.main:run_app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

